<!--Listado de Películas-->
<app-listado-generico [listado]="movies">

  <ng-container contenido>
    <div class="peliculas-contenedor">
      @for (pelicula of movies; track $index) {
        <div class="pelicula-contenedor">
          <a>
            @if (pelicula.poster) {
              <img [src]="pelicula.poster" [alt]="pelicula.title">
            } @else {
              <img src="default.jpg" [alt]="pelicula.title">
            }
          </a>
          <p>
            <a>{{ pelicula.title | uppercase }}</a>
          </p>
          <div>
            <a mat-flat-button>Edit</a>
            <button mat-flat-button type="button" class="warn">Borrar</button>
          </div>
        </div>
      }
    </div>
  </ng-container>
</app-listado-generico>
