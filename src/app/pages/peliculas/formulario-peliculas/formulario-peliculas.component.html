<form [formGroup]="form" (submit)="guardarCambios()">

  <mat-form-field appearance="outline">
    <mat-label>Titulo</mat-label>
    <input matInput [formControl]="form.controls.titulo">
    <mat-error>{{obtenerErrorCampoTitulo()}}</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Fecha Lanzamiento</mat-label>
    <input matInput [matDatepicker]="picker" [formControl]="form.controls.fechaLanzamiento">
    <mat-datepicker #picker></mat-datepicker>
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-error>{{obtenerErrorFechaLanzamiento()}}</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Trailer</mat-label>
    <input matInput [formControl]="form.controls.trailer">
  </mat-form-field>

  <app-input-img titulo="Poster d ela Pelicula" [urlImagenActual]="modelo?.poster"
    (archivoSelecionado)="archivoSelecionado($event)"></app-input-img>

  <mat-grid-list cols="2" rowHeight="500px" gutterSize="20px">

    <mat-grid-tile>
      <div>
        <h4>Seleccione los Géneros</h4>
        <app-selector-multiple [Seleccionados]="generosSelecionados"
          [NoSeleccionados]="generosNoSelecionados"></app-selector-multiple>
      </div>
    </mat-grid-tile>

    <mat-grid-tile>
      <div>
        <h4>Seleccione los Cines</h4>
        <app-selector-multiple [Seleccionados]="cinesSeleccionados"
          [NoSeleccionados]="cinesNoSeleccionados"></app-selector-multiple>
      </div>
    </mat-grid-tile>

  </mat-grid-list>

  <h4>Seleccione los Actores</h4>

  <app-autocomplete-actores [actoresSeleccionados]="actoresSeleccionados"></app-autocomplete-actores>

  <div class="contenedor-botones">
    <button type="submit" mat-flat-button [disabled]="form.invalid">Guardar Cambios</button>
    <a mat-stroked-button routerLink="/">Cancelar</a>
  </div>

</form>
